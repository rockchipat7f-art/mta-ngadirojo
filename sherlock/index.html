<!DOCTYPE html>
<html lang="id">

<head>
  <title>Login Gerbang Asia</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
    }

    .konten-utama {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #2c3e50, #0f171e);
      z-index: 1;
    }

    .box-konten {
      text-align: center;
      color: #fff;
    }

    .box-konten h1 {
      font-size: 3.5rem;
      color: #f1c40f;
      margin-bottom: 10px;
    }

    .layer-login {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      transition: opacity 0.8s ease, visibility 0.8s;
      background: rgba(0, 0, 0, 0.4);
    }

    .layer-login.hilang {
      opacity: 0;
      visibility: hidden;
    }

    .form-login {
      background: #1e272c;
      padding: 40px;
      border-radius: 8px;
      border: 3px solid #f1c40f;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      width: 350px;
      text-align: center;
    }

    .form-login h2 {
      color: #f1c40f;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    /* TAMBAHAN CSS UNTUK INPUT LOGIN */
    .form-login input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: #111;
      border: 1px solid #34495e;
      color: #fff;
      border-radius: 4px;
      outline: none;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-login input:focus {
      border-color: #f1c40f;
    }

    .pesan-error {
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 15px;
      display: none; /* Disembunyikan secara default */
    }

    .form-login button {
      width: 100%;
      padding: 12px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .form-login button:hover {
      background: #962d22;
    }

    .screen-gerbang {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      z-index: 10;
      pointer-events: none;
    }

    .sisi-gerbang {
      position: relative;
      width: 50%;
      height: 100%;
      background-color: #4a0e17;
      transition: transform 1.8s cubic-bezier(0.77, 0, 0.175, 1);
      display: flex;
      align-items: flex-end;
      pointer-events: auto;
    }

    .gerbang-kiri {
      transform-origin: left center;
      border-right: 4px solid #f1c40f;
      justify-content: flex-end;
    }

    .gerbang-kanan {
      transform-origin: right center;
      border-left: 4px solid #f1c40f;
      justify-content: flex-start;
    }

    .pilar {
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 85%;
      background: linear-gradient(to right, #962d22, #c0392b, #7f261e);
    }

    .gerbang-kiri .pilar {
      left: 10%;
    }

    .gerbang-kanan .pilar {
      right: 10%;
    }

    .daun-pintu {
      width: 100%;
      height: 75%;
      background: #78131e;
      border: 15px solid #5c0f17;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ornamen-kotak {
      width: 70%;
      height: 80%;
      border: 4px solid #f1c40f;
      background-image: linear-gradient(rgba(241, 196, 15, 0.3) 2px, transparent 2px), linear-gradient(90deg, rgba(241, 196, 15, 0.3) 2px, transparent 2px);
      background-size: 40px 40px;
    }

    .atap-kiri {
      right: 0;
      border-radius: 100px 0 0 0;
    }

    .atap-kanan {
      left: 0;
      border-radius: 0 100px 0 0;
    }

    .screen-gerbang.terbuka .gerbang-kiri {
      transform: translateX(-100%);
    }

    .screen-gerbang.terbuka .gerbang-kanan {
      transform: translateX(100%);
    }

    .btn-logout {
      margin-top: 20px;
      padding: 10px 25px;
      background: #2c3e50;
      color: #f1c40f;
      border: 2px solid #f1c40f;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: #f1c40f;
      color: #111;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
    }
  </style>
</head>

<body>
  <div class="konten-utama" id="irowkz">
    <div class="box-konten" id="ix1cun">
      <h1 id="iruwil">Selamat Datang</h1>
      <p id="ione7j">Anda berhasil masuk ke dalam kuil rahasia.</p>
      <button type="button" class="btn-logout" id="btnTutup">Logout</button>
    </div>
  </div>
  
  <div id="loginLayer" class="layer-login">
    <div class="form-login" id="ignnql">
      <h2 id="iewst5">Masuk Kuil</h2>
      
      <input type="text" id="inputUser" placeholder="Username" autocomplete="off" />
      <input type="password" id="inputPass" placeholder="Password" />
      <p id="pesanError" class="pesan-error">Kredensial salah, gerbang terkunci!</p>
      
      <button type="button" id="btnBuka">Buka Gerbang</button>
    </div>
  </div>
  
  <div id="gerbangUtama" class="screen-gerbang">
    <div class="sisi-gerbang gerbang-kiri" id="ii0adi">
      <div class="atap-kiri" id="irm1dj"></div>
      <div class="pilar" id="il90mv"></div>
      <div class="daun-pintu" id="i0ar7a">
        <div class="ornamen-kotak" id="igulsb"></div>
      </div>
    </div>
    <div class="sisi-gerbang gerbang-kanan" id="i2nj93">
      <div class="atap-kanan" id="i5j0ot"></div>
      <div class="pilar" id="i152yh"></div>
      <div class="daun-pintu" id="ie8uu1">
        <div class="ornamen-kotak" id="i7r428"></div>
      </div>
    </div>
  </div>
  
<script>
    // Memastikan elemen sudah dirender sebelum script berjalan
    document.addEventListener("DOMContentLoaded", function() {
      
      const btnBuka = document.getElementById('btnBuka');
      const btnTutup = document.getElementById('btnTutup');
      const loginLayer = document.getElementById('loginLayer');
      const gerbangUtama = document.getElementById('gerbangUtama');
      
      // Mengambil elemen input
      const inputUser = document.getElementById('inputUser');
      const inputPass = document.getElementById('inputPass');
      const pesanError = document.getElementById('pesanError');

      // 1. Event Listener: BUKA GERBANG dengan Logika
      btnBuka.addEventListener('click', function() {
        
        // .trim() menghapus spasi ekstra di awal/akhir
        // .toLowerCase() memaksa huruf menjadi kecil semua
        const username = inputUser.value.trim().toLowerCase();
        const password = inputPass.value.trim();

        // Cek kecocokan
        if (username === "admin" && password === "rahasia") {
          
          pesanError.style.display = "none"; // Hilangkan pesan error jika benar
          loginLayer.classList.add('hilang');
          
          setTimeout(() => {
            gerbangUtama.classList.add('terbuka');
          }, 300);
          
        } else {
          // Tampilkan pesan error jika salah
          pesanError.style.display = "block";
          
          // Efek getar kecil pada box login
          const formLogin = document.getElementById('ignnql');
          formLogin.style.transform = "translate(5px, 0)";
          setTimeout(() => { formLogin.style.transform = "translate(-5px, 0)"; }, 100);
          setTimeout(() => { formLogin.style.transform = "translate(5px, 0)"; }, 200);
          setTimeout(() => { formLogin.style.transform = "translate(0, 0)"; }, 300);
        }
      });

      // 2. Event Listener: TUTUP GERBANG (LOGOUT)
      btnTutup.addEventListener('click', function() {
        gerbangUtama.classList.remove('terbuka'); 
        
        // Bersihkan kolom input saat logout
        inputUser.value = "";
        inputPass.value = "";
        pesanError.style.display = "none";
        
        setTimeout(() => {
          loginLayer.classList.remove('hilang'); 
        }, 1500);
      });

    });
  </script>
